# Mastodon configuration (loaded from separate file)
spring.config.import=optional:application-mastodon.properties

# Database: persistent H2 (file mode), survives restarts
spring.datasource.url=jdbc:h2:file:./.h2/mcp;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway schema management
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# H2 console for local debugging
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server and logging
server.port=${PORT:8080}

logging.level.root=INFO
logging.level.com.team.mcp=INFO
spring.jpa.show-sql=false
logging.level.org.hibernate.SQL=INFO

# Application secrets and crypto
# Encryption key is read from the environment.
# Example (not for production): export APP_KMS_KEY=base64:aabbcc...
app.kms.key=${APP_KMS_KEY:change-me-in-env}

# Search configuration
# Valid values: "timeline" (in-memory) or "db"
app.search.source=timeline
