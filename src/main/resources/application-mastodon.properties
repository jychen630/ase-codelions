# Mastodon configuration
mastodon.instance-base-url=https://mastodon.social

# OAuth client credentials.
# For security, the real values are read from environment variables.
# Do NOT put real secrets directly in this file.
mastodon.oauth.client-id=${MASTODON_OAUTH_CLIENT_ID:changeme}
mastodon.oauth.client-secret=${MASTODON_OAUTH_CLIENT_SECRET:changeme}

# Redirect URI used both locally and in cloud (can be overridden via env var).
mastodon.oauth.redirect-uri=${MASTODON_OAUTH_REDIRECT_URI:http://localhost:8080/auth/callback}

# Scopes requested from Mastodon (can be overridden if needed).
mastodon.oauth.scopes=${MASTODON_OAUTH_SCOPES:read:statuses write:statuses read:accounts}

# Derived URLs based on the instance base URL.
mastodon.oauth.auth-url=${mastodon.instance-base-url}/oauth/authorize
mastodon.oauth.token-url=${mastodon.instance-base-url}/oauth/token

